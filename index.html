<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storystick</title>
    <meta
      name="description"
      content="Storystick — draw blueprints and plans for buildings, renovations and woodworking projects, with cut lists, schedules and estimates."
    />
    <link rel="stylesheet" href="./styles/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f2933'/%3E%3Cpath d='M5 21 L27 9 M5 25 L27 13' stroke='%23f7f5f0' stroke-width='2.5'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" class="logo" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="#1f2933" />
          <path d="M5 21 L27 9 M5 25 L27 13" stroke="#f7f5f0" stroke-width="2.5" />
          <circle cx="9" cy="23" r="1.8" fill="#f59e0b" />
        </svg>
        <div>
          <span class="brand-name">Storystick</span>
          <button id="project-name" class="project-name" title="Rename project">Untitled Project</button>
        </div>
      </div>

      <nav class="top-actions">
        <button id="btn-new" class="btn">New</button>
        <button id="btn-open" class="btn">Open</button>
        <button id="btn-save" class="btn">Save</button>
        <span class="divider"></span>
        <button id="btn-undo" class="btn" title="Undo (Ctrl+Z)">Undo</button>
        <button id="btn-redo" class="btn" title="Redo (Ctrl+Shift+Z)">Redo</button>
        <span class="divider"></span>
        <button id="btn-cutlist" class="btn accent">Cut list</button>
        <button id="btn-schedules" class="btn">Schedules</button>
        <button id="btn-estimate" class="btn">Estimate</button>
        <span class="divider"></span>
        <button id="btn-export" class="btn">Export</button>
        <button id="btn-settings" class="btn">Settings</button>
        <button id="btn-help" class="btn" title="Keyboard shortcuts">?</button>
      </nav>
    </header>

    <div id="tool-options" class="tool-options"></div>

    <main class="workspace">
      <aside id="toolbar" class="toolbar"></aside>

      <section class="canvas-wrap">
        <canvas id="canvas" tabindex="0"></canvas>
        <div class="view-controls">
          <button id="btn-zoom-in" class="icon-btn" title="Zoom in">+</button>
          <button id="btn-zoom-out" class="icon-btn" title="Zoom out">−</button>
          <button id="btn-fit" class="icon-btn" title="Zoom to fit (F)">⤢</button>
        </div>
      </section>

      <aside class="sidebar">
        <section class="panel">
          <h3>Sheets</h3>
          <div id="panel-pages"></div>
        </section>
        <section class="panel">
          <h3>Layers</h3>
          <div id="panel-layers"></div>
        </section>
        <section class="panel grow">
          <h3>Properties</h3>
          <div id="panel-properties"></div>
        </section>
      </aside>
    </main>

    <footer class="statusbar">
      <span id="status-coords" class="mono">X 0"   Y 0"</span>
      <div class="toggles">
        <button id="toggle-osnap" class="toggle" title="Object snap (F3)">SNAP</button>
        <button id="toggle-grid" class="toggle" title="Grid snap (F7)">GRID</button>
        <button id="toggle-ortho" class="toggle" title="Ortho (F8)">ORTHO</button>
      </div>
      <label class="command">
        <span>Length</span>
        <input id="command-input" type="text" placeholder='e.g. 8&apos;-6" or 48 x 24' autocomplete="off" />
      </label>
      <span id="status-message" class="status-message"></span>
    </footer>

    <div id="modal-root" class="modal-root"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
