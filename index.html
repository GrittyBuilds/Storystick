<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Storystick</title>
    <meta
      name="description"
      content="Storystick — draw it before you build it. Plans for buildings, renovations and woodworking projects, with cut lists, schedules and estimates."
    />
    <meta name="theme-color" content="#0F2338" />
    <link rel="icon" href="./brand/icon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="./brand/icon/favicon-mark.svg" />
    <link rel="apple-touch-icon" href="./brand/icon/app-icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body data-mode="blueprint">
    <header class="topbar">
      <div class="brand">
        <img
          class="brand-logo on-dark"
          src="./brand/logo/svg/lockup-horizontal-reverse.svg"
          alt="Storystick"
        />
        <img class="brand-logo on-light" src="./brand/logo/svg/lockup-horizontal.svg" alt="Storystick" />
        <div class="brand-meta">
          <button id="project-name" class="project-name" title="Rename project">Untitled Project</button>
          <span id="project-path" class="project-path"></span>
        </div>
      </div>

      <button id="btn-menu" class="btn tiny menu-btn" aria-label="Menu">⋯</button>

      <nav class="top-actions">
        <button id="btn-new" class="btn tiny">New</button>
        <button id="btn-open" class="btn tiny">Open</button>
        <button id="btn-save" class="btn tiny">Save</button>
        <span class="divider"></span>
        <button id="btn-undo" class="btn tiny" title="Undo (Ctrl+Z)">Undo</button>
        <button id="btn-redo" class="btn tiny" title="Redo (Ctrl+Shift+Z)">Redo</button>
        <span class="divider"></span>
        <button id="btn-cutlist" class="btn tiny primary">Cut list</button>
        <button id="btn-schedules" class="btn tiny">Schedules</button>
        <button id="btn-estimate" class="btn tiny">Estimate</button>
        <button id="btn-codecheck" class="btn tiny">Code</button>
        <button id="btn-structural" class="btn tiny">Structural</button>
        <span class="divider"></span>
        <button id="btn-export" class="btn tiny">Export</button>
        <button id="btn-settings" class="btn tiny">Settings</button>
        <button id="btn-install" class="btn tiny" hidden>Install</button>
        <button id="btn-help" class="btn tiny" title="Keyboard shortcuts">?</button>
      </nav>
    </header>

    <div id="tool-options" class="tool-options"></div>

    <main class="workspace">
      <aside id="toolbar" class="toolbar"></aside>

      <section class="canvas-wrap">
        <canvas id="canvas" tabindex="0"></canvas>
        <canvas id="canvas3d" hidden></canvas>
        <div class="view-switch" role="group" aria-label="View">
          <button id="view-2d" type="button" class="on">2D Plan</button>
          <button id="view-3d" type="button">3D</button>
        </div>
        <div class="mode-switch" role="group" aria-label="Canvas mode">
          <button id="mode-blueprint" type="button">Blueprint</button>
          <button id="mode-paper" type="button">Paper</button>
        </div>
        <div id="view-presets" class="view-presets" hidden>
          <button type="button" data-view="iso">Iso</button>
          <button type="button" data-view="top">Top</button>
          <button type="button" data-view="front">Front</button>
          <button type="button" data-view="back">Back</button>
          <button type="button" data-view="left">Left</button>
          <button type="button" data-view="right">Right</button>
          <button type="button" id="view-fit">Fit</button>
        </div>
        <div class="view-controls">
          <button id="btn-zoom-in" class="icon-btn" title="Zoom in">+</button>
          <button id="btn-zoom-out" class="icon-btn" title="Zoom out">−</button>
          <button id="btn-fit" class="icon-btn" title="Zoom to fit (F)">⤢</button>
        </div>
      </section>

      <aside class="sidebar">
        <div class="sheet-head">
          <span id="sheet-title">Panels</span>
          <button id="sheet-close" type="button" class="btn tiny">Done</button>
        </div>
        <section class="panel">
          <h3>Sheets</h3>
          <div id="panel-pages"></div>
        </section>
        <section class="panel">
          <h3>Layers</h3>
          <div id="panel-layers"></div>
        </section>
        <section class="panel grow">
          <h3>Properties</h3>
          <div id="panel-properties"></div>
        </section>
      </aside>
    </main>

    <nav class="mobile-bar" aria-label="Panels">
      <button id="mob-sheets" type="button">Sheets</button>
      <button id="mob-layers" type="button">Layers</button>
      <button id="mob-properties" type="button">Properties</button>
    </nav>

    <div id="sheet-backdrop" class="sheet-backdrop"></div>

    <footer class="statusbar">
      <span id="status-coords">X 0"   Y 0"</span>
      <div class="toggles">
        <button id="toggle-osnap" class="toggle" title="Object snap (F3)">SNAP</button>
        <button id="toggle-grid" class="toggle" title="Grid snap (F7)">GRID</button>
        <button id="toggle-ortho" class="toggle" title="Ortho (F8)">ORTHO</button>
      </div>
      <label class="command">
        <span>Length</span>
        <input id="command-input" type="text" placeholder="8'-6&quot;  ·  48 x 24" autocomplete="off" />
      </label>
      <span id="status-message" class="status-message"></span>
    </footer>

    <div id="modal-root" class="modal-root"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
